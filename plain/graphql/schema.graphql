"""
The channel a broadcast is authored for. Content is written against a specific
channel's rendering rules, so it is not portable between channels.
"""
enum BroadcastType {
  """The broadcast is authored to be sent over Slack."""
  SLACK
}

"""
Who a broadcast is sent as. Which sender a broadcast carries is decided by the
channel it is authored for, so each channel contributes its own variant.
"""
union BroadcastSender = SlackBroadcastSender | PlainWorkspaceBroadcastSender

type SlackBroadcastSender {
  """
  The user the broadcast is posted as. Its name and avatar are applied to the Slack message.
  """
  user: UserActor!
}

"""
The workspace itself, rather than any one person. Its name and logo are applied to the Slack
message, so the broadcast arrives from the company rather than from Plain.
"""
type PlainWorkspaceBroadcastSender {
  """
  The workspace the broadcast is posted as. Its name and logo are what recipients see.
  """
  workspace: Workspace!
}

"""
Who a broadcast is sent as. Set alongside the matching id on input: `PLAIN_USER` requires
`senderUserId`, `PLAIN_WORKSPACE` takes none.
"""
enum BroadcastSenderType {
  """
  The workspace itself. Nobody is impersonated, so the message goes out under the workspace's own
  name and logo.
  """
  PLAIN_WORKSPACE

  """
  A Plain user in this workspace, whose name and avatar are applied to the message.
  """
  PLAIN_USER
}

"""How the `content` of a broadcast is encoded."""
enum BroadcastContentFormat {
  """`content` is a serialised Tiptap document."""
  TIPTAP
}

"""Why a broadcast or audience currently resolves to nobody."""
enum BroadcastSendTargetRecipientsEmptyReason {
  """
  No tenant matches the filter. The filter itself is what needs changing.
  """
  NO_TENANTS_MATCHED

  """
  Tenants match, but none of them can be reached. On Slack that means no connected customer channel that is enabled.
  """
  NO_RECIPIENTS_RESOLVED

  """Something matched, and the target's own exclusions removed all of it."""
  EXCLUDED_BY_AUDIENCE
}

"""
How many recipients a target resolves to right now. Point-in-time: it moves as tenants, tiers and
tenant fields change, and as channels are connected or disabled, so it is not a promise about who
will receive a send made later.

Resolved through the same path a send uses, so this is the number that would actually be delivered
to rather than an estimate assembled another way.
"""
type BroadcastSendTargetRecipients {
  """
  Recipients resolved. Exact: there is no ceiling on what a target may resolve to.
  """
  count: Int!

  """Why `count` is zero. Null whenever it is not."""
  emptyReason: BroadcastSendTargetRecipientsEmptyReason

  """
  The resolved recipients, in the order the count above counted them. `searchQuery` narrows these rows
  by name without changing `count`, which is how large the audience is rather than how much of it is
  being shown.
  """
  recipients(first: Int, after: String, last: Int, before: String, searchQuery: String): BroadcastSendTargetRecipientConnection!
}

"""
Its own connection rather than `ConnectedSlackChannelConnection`, which carries the filters it was
queried by. An audience with `and`/`or`/`not` is not expressible as one channel filter, so there is
no honest value to put there.

The edges are Slack channels because a broadcast can only be authored for Slack today. A second
broadcast type widens the node rather than adding a second connection.
"""
type BroadcastSendTargetRecipientConnection {
  pageInfo: PageInfo!
  edges: [ConnectedSlackChannelEdge!]!
}

"""
Where a broadcast is in its lifecycle. Derived from the broadcast's latest real send, so it is
never stored on the broadcast itself. Test sends do not affect it.
"""
enum BroadcastStatus {
  """The broadcast has never been scheduled. It is fully editable."""
  DRAFT

  """
  A send is queued for a future time, or for as soon as possible. Still editable until it starts.
  """
  SCHEDULED

  """
  The send has started and is working out which recipients it applies to.
  """
  RESOLVING

  """The send is delivering to its recipients."""
  SENDING

  """Every recipient in the send received the message."""
  SENT

  """
  The send finished, but the message reached some recipients and not others.
  """
  PARTIALLY_SENT

  """The send finished without reaching any recipient."""
  FAILED

  """The send was cancelled before it completed."""
  CANCELLED
}

"""
Where one run of a broadcast is in its lifecycle. The same values `BroadcastStatus` carries apart
from `DRAFT`, which describes a broadcast with no send rather than a send.
"""
enum BroadcastSendStatus {
  SCHEDULED
  RESOLVING
  SENDING
  SENT
  PARTIALLY_SENT
  FAILED
  CANCELLED
}

"""Where one recipient's copy of a broadcast is in its lifecycle."""
enum BroadcastSendDeliveryStatus {
  """Resolved as a recipient and waiting to be posted."""
  PENDING

  """
  Being posted right now. A delivery left here by an invocation that died mid-post is picked up by
  the recovery sweep, so this is not always a delivery actively in flight.
  """
  SENDING

  """The message reached this recipient."""
  SENT

  """
  The message did not reach this recipient and will not be retried. `failureReason` says why.
  """
  FAILED
}

"""
Why a delivery failed. Terminal in every case — a failure that was worth retrying was retried before
the delivery reached `FAILED`.
"""
enum BroadcastSendDeliveryFailureReason {
  """
  Plain is not connected to this Slack channel, so there is no token to post with.
  """
  CHANNEL_NOT_CONNECTED

  """The send this delivery belongs to no longer exists."""
  SEND_MISSING

  """The broadcast was deleted after the send started."""
  BROADCAST_DELETED

  """The broadcast's content is empty, so there is nothing to post."""
  EMPTY_CONTENT

  """The broadcast's content could not be converted into a Slack message."""
  INVALID_CONTENT

  """
  The broadcast has no notification title, which recipients see before opening anything.
  """
  NOTIFICATION_TITLE_NOT_SET

  """
  The workspace's Slack integration for this recipient's team is missing.
  """
  SLACK_INTEGRATION_NOT_FOUND

  """The broadcast has no sender set."""
  SENDER_NOT_SET

  """The user the broadcast sends as no longer exists."""
  SENDER_USER_MISSING

  """
  The user the broadcast sends as cannot be sent as any more, for example after being deactivated.
  """
  SENDER_UNAVAILABLE

  """
  The recipient is an email address, which broadcasts cannot yet be delivered to.
  """
  EMAIL_DELIVERY_NOT_SUPPORTED

  """
  Plain's Slack app is missing a scope it needs to post. Reconnecting the integration fixes this.
  """
  MISSING_SLACK_SCOPES

  """
  Slack rejected the message's formatting. Retrying the same content cannot succeed.
  """
  INVALID_SLACK_BLOCKS

  """Slack rejected the post for a reason that will not change on a retry."""
  SLACK_UNRECOVERABLE

  """Slack kept failing and the delivery ran out of attempts."""
  MAX_ATTEMPTS

  """
  The delivery failed for a reason this version of the API does not know how to name. Treat it as an
  unspecified failure rather than a stable value to branch on.
  """
  UNKNOWN
}

"""
How many of a send's recipients are in each state. Read as one snapshot: the counts are taken by a
single query, so they always sum to `total`.
"""
type BroadcastSendDeliveryCounts {
  pending: Int!
  sending: Int!
  sent: Int!
  failed: Int!

  """
  Every recipient this send resolved to. Zero until the send has resolved its recipients, including
  while it is still `SCHEDULED`.
  """
  total: Int!
}

"""
Who one delivery was addressed to. The variant matches the channel the broadcast was authored for.
Slack channels are identified rather than named — resolve the name through `connectedSlackChannels`,
bearing in mind that a `CHANNEL_NOT_CONNECTED` failure means there is no channel there to name.
"""
union BroadcastSendDeliveryRecipient = SlackBroadcastSendDeliveryRecipient | EmailBroadcastSendDeliveryRecipient

type SlackBroadcastSendDeliveryRecipient {
  """
  A channel id is only unique within its Slack team, so the two together identify the channel.
  """
  slackTeamId: ID!
  slackChannelId: ID!

  """
  The channel's name as it was when the send resolved, so a delivery still names the channel it went to
  after a rename or a disconnection. Null for deliveries from before the name was recorded — read the
  channel by `slackTeamId` and `slackChannelId` to name those.
  """
  slackChannelName: String
}

type EmailBroadcastSendDeliveryRecipient {
  emailAddress: String!
}

"""One recipient's copy of a broadcast, and what became of it."""
type BroadcastSendDelivery {
  id: ID!
  recipient: BroadcastSendDeliveryRecipient!
  status: BroadcastSendDeliveryStatus!

  """Why the delivery failed. Null unless `status` is `FAILED`."""
  failureReason: BroadcastSendDeliveryFailureReason

  """
  How many times posting this delivery has been attempted. Zero for a delivery that never reached Slack.
  """
  attempts: Int!

  """When the last attempt started, or null if there has not been one."""
  lastAttemptedAt: DateTime
}

type BroadcastSendDeliveryEdge {
  cursor: String!
  node: BroadcastSendDelivery!
}

type BroadcastSendDeliveryConnection {
  edges: [BroadcastSendDeliveryEdge!]!
  pageInfo: PageInfo!

  """How many deliveries match the query, ignoring pagination."""
  totalCount: Int!
}

