input BroadcastContentFormatInput {
  value: BroadcastContentFormat!
}

"""
Nullable, unlike `BroadcastContentFormatInput`: clearing the sender is how a broadcast goes back to having none.
"""
input BroadcastSenderTypeInput {
  value: BroadcastSenderType
}

"""
The channel a recipient is reached on. A broadcast's own `type` decides which of these its target may name.
"""
enum BroadcastRecipientType {
  SLACK
}

"""
Someone a broadcast is aimed at by name rather than by filter.

Flat with a `type` rather than a union, because GraphQL has no input unions and the input and output
shapes should not diverge. The per-channel fields are nullable for the same reason: an email recipient
will carry an address and no channel, and making them nullable now is what keeps that from being a
breaking change later. Read `type` first.
"""
type BroadcastSendTargetRecipient {
  type: BroadcastRecipientType!

  """
  Set when `type` is `SLACK`. A channel id is only unique within its team, so both are needed to name one.
  """
  slackTeamId: ID
  slackChannelId: ID
}

enum BroadcastSendTargetScope {
  """
  Every tenant with a connected channel. Resolves at the channel layer, so a tenant with no connected channel contributes nothing rather than erroring.
  """
  ALL_TENANTS

  """Only the tenants the target's `filters` match."""
  MATCHING
}

type BroadcastSendTarget {
  """
  Whether the broadcast reaches every tenant or only the ones `filters` matches. Null until the author has chosen.
  """
  scope: BroadcastSendTargetScope

  """
  Who the broadcast reaches. Audiences, tiers, tenants and channel-name matches are all dimensions of this one filter. Set when `scope` is `MATCHING`, and null otherwise.
  """
  filters: BroadcastAudienceFilter

  """
  Recipients named outright, added to whatever `filters` resolved to. One the workspace cannot reach — on Slack, a channel it cannot post to — is dropped, the same as one named inside an audience.
  """
  recipients: [BroadcastSendTargetRecipient!]!

  """
  Recipients the author unchecked from what the target resolved to. Subtracted last, so a broadcast can drop one without editing the audience that pulled it in.
  """
  excludeRecipients: [BroadcastSendTargetRecipient!]!
}

"""
Mirrors `BroadcastSendTargetRecipient`. Supply the fields belonging to the `type` given.
"""
input BroadcastSendTargetRecipientInput {
  type: BroadcastRecipientType!
  slackTeamId: ID
  slackChannelId: ID
}

input BroadcastSendTargetRecipientsInput {
  """
  The channel the target is written for. An audience of another type cannot be resolved against it.
  """
  type: BroadcastType!
  sendTarget: BroadcastSendTargetInput!
}

input BroadcastSendTargetInput {
  """
  Who the filter side of the target reaches. `MATCHING` requires `filters`; `ALL_TENANTS` rejects it. Omit it to target only what `recipients` names, or nobody at all when that is empty too.
  """
  scope: BroadcastSendTargetScope

  """
  Who the broadcast reaches. Every audience it names must be of the same type as the broadcast. Must constrain something: reaching every tenant is the `ALL_TENANTS` scope, not an empty filter. A node nested below the first must constrain something too.
  """
  filters: BroadcastAudienceFilterInput

  """
  Recipients to send to by id, added to whatever `filters` resolves to. For a caller that has ids rather
  than a predicate; one the workspace cannot reach is dropped rather than failed. Either side of the
  target stands alone: filters with no ids, or ids with no `scope`.
  """
  recipients: [BroadcastSendTargetRecipientInput!]
  excludeRecipients: [BroadcastSendTargetRecipientInput!]
}

input CreateBroadcastInput {
  name: String!

  """
  The title recipients see in the notification. Can be set later, but is required before the broadcast can be sent.
  """
  notificationTitle: String

  """The body of the broadcast, encoded as declared by `contentFormat`."""
  content: String!

  """How `content` is encoded."""
  contentFormat: BroadcastContentFormat!
  type: BroadcastType!

  """
  Which kind of sender `senderUserId` describes. Required alongside `senderUserId`, and rejected with it when `PLAIN`.
  """
  senderType: BroadcastSenderType
  senderUserId: ID
  senderEmailAddress: String
  sendTarget: BroadcastSendTargetInput
}

type CreateBroadcastOutput {
  broadcast: Broadcast
  error: MutationError
}

input UpdateBroadcastInput {
  broadcastId: ID!
  name: StringInput

  """
  The title recipients see in the notification. Pass null to clear it; a broadcast with none cannot be sent.
  """
  notificationTitle: OptionalStringInput

  """
  Set alongside `contentFormat` whenever the encoding of the new body differs from the stored one.
  """
  content: StringInput
  contentFormat: BroadcastContentFormatInput

  """
  Which kind of sender `senderUserId` describes. Validated against the state the broadcast will
  hold, so either half can be set on its own as long as the result is coherent: `PLAIN_USER`
  needs a `senderUserId`, `PLAIN` must not have one.
  """
  senderType: BroadcastSenderTypeInput
  senderUserId: OptionalStringInput
  senderEmailAddress: OptionalStringInput

  """
  Pass a target to replace the current one, or an empty `channels` list to clear it. Omit to leave
  it unchanged. Clearing the target — or the sender — of a broadcast that is already scheduled is
  rejected, because a scheduled broadcast has to stay sendable.
  """
  sendTarget: BroadcastSendTargetInput
}

