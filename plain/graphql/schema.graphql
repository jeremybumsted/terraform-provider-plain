"""
Emitted to the current user when one of their Sidekick sessions becomes unread
(i.e. an agent response settled into IDLE). Carries the affected discussion id;
clients typically refetch their sessions list on receipt.
"""
type SidekickSessionsChange {
  discussionId: ID!
}

type SubscriptionAcknowledgement {
  subscriptionId: ID!
}

union CustomerCardInstanceChangesResult = CustomerCardInstanceChange | SubscriptionAcknowledgement

