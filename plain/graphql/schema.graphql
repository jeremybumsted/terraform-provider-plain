"""
The data type of a thread field schema, which determines which value field is used when reading or writing thread field values.
"""
enum ThreadFieldSchemaType {
  """Stores a free-text value as a string."""
  STRING

  """Stores a boolean value."""
  BOOL

  """
  Stores one value chosen from a predefined set of allowed string values.
  """
  ENUM

  """Stores a numeric value as a float."""
  NUMBER

  """Stores a monetary amount as a float."""
  CURRENCY

  """Stores a date/time value as a DateTime scalar."""
  DATE
}

type DependsOnThreadFieldType {
  threadFieldSchemaId: ID!
  threadFieldSchemaValue: String!
}

type DependsOnLabelType {
  labelTypeId: ID!
}

"""
Defines the shape and behaviour of a custom field that can be attached to threads.
"""
type ThreadFieldSchema {
  id: ID!

  """
  The human-readable name of the field. Must be unique across all thread field schemas in the workspace; reusing a label fails with `cannot_create_thread_field_schema`.
  """
  label: String!

  """
  A stable identifier for the field used when reading and writing values. Must be lowercase and contain only letters, numbers, and underscores (it is validated against `^[a-z0-9_]+$`), so camelCase and hyphens are rejected. Set at creation and immutable thereafter — correcting a mistyped key means deleting and recreating the field, which discards any stored values.
  """
  key: String!
  description: String!

  """
  Controls the position of this field relative to other thread field schemas in the UI.
  """
  order: Int!
  type: ThreadFieldSchemaType!

  """Valid options for ENUM-typed fields. Empty for all other field types."""
  enumValues: [String!]!
  defaultStringValue: String
  defaultBooleanValue: Boolean
  defaultNumberValue: Float
  defaultDateValue: DateTime

  """
  When true, a thread cannot be marked as done until this field has a value.
  """
  isRequired: Boolean!

  """
  When true, Plain's AI will attempt to automatically fill this field based on the thread's content. Only supported for ENUM and BOOL field types.
  """
  isAiAutoFillEnabled: Boolean!

  """
  When true, this field may be included as context for an AI agent handling the thread.
  """
  isAvailableToAgents: Boolean!

  """
  When true, the field value can only be set via the API and is not editable by agents in the Plain UI.
  """
  isClientReadonly: Boolean!

  """
  If set, this field is only shown when the referenced sibling field has a specific value. Nesting is capped at one level: the referenced parent field must not itself depend on another thread field, otherwise creation fails with `cannot_create_thread_field_schema` (the dependent nesting level is too deep).
  """
  dependsOnThreadField: DependsOnThreadFieldType

  """
  If non-empty, this field is only shown when the thread has at least one of the listed label types.
  """
  dependsOnLabels: [DependsOnLabelType!]!
  createdAt: DateTime!
  createdBy: InternalActor!
  updatedAt: DateTime!
  updatedBy: InternalActor!
}

"""A stored value for a custom thread field on a specific thread."""
type ThreadField {
  id: ID!
  threadId: ID!

  """The stable key of the corresponding thread field schema."""
  key: String!
  type: ThreadFieldSchemaType!

  """
  True when this field value was set automatically by Plain's AI rather than by a human or API call.
  """
  isAiGenerated: Boolean!
  stringValue: String
  booleanValue: Boolean
  numberValue: Float
  dateValue: DateTime
  createdAt: DateTime!
  createdBy: Actor!
  updatedAt: DateTime!
  updatedBy: Actor!
}

union ThreadDiscussionChannelDetails = ThreadDiscussionSlackChannelDetails | ThreadDiscussionEmailChannelDetails | ThreadDiscussionCursorWorkspaceBackgroundAgentChannelDetails | ThreadDiscussionAgentSessionChannelDetails

type ThreadDiscussionSlackChannelDetails {
  slackTeamId: ID!
  slackChannelId: ID!
  slackChannelName: String!
  slackMessageLink: String
}

type ThreadDiscussionEmailChannelDetails {
  emailRecipients: [String!]!
}

type ThreadDiscussionCursorWorkspaceBackgroundAgentChannelDetails {
  cursorWorkspaceIntegrationId: ID!
  repositoryUrl: String
}

type ThreadDiscussionAgentSessionChannelDetails {
  """
  Null when a customer's own agent drives the discussion: Plain runs no session for one.
  """
  agentSessionId: ID @deprecated(reason: "Use ThreadDiscussion.agentSessionId instead. A discussion's session does not depend on its channel, so reading it here forces a narrow by channel type. This field still resolves.")
}

enum ThreadDiscussionVisibility {
  """Visible to all members of the workspace."""
  WORKSPACE

  """Visible only to the user who created the discussion."""
  USER
}

enum ThreadDiscussionStatus {
  """
  The discussion is open. What the agent is doing is reported by agentStatus.
  """
  OPEN

  """The discussion has been marked as resolved."""
  RESOLVED
}

"""
The state of the agent working on a discussion, independent of whether the discussion itself is open or resolved.
"""
enum ThreadDiscussionAgentStatus {
  """
  No agent turn has been observed on this discussion. Usually means no agent is involved at all;
  it also covers the window between an agent being addressed and its first turn being recorded.
  """
  UNKNOWN

  """An agent is attached to the discussion but is not currently working."""
  IDLE

  """The agent is working."""
  IN_PROGRESS

  """The agent has stopped and is waiting on a human, e.g. for an approval."""
  NEEDS_INPUT
}

type ThreadDiscussion {
  id: ID!

  """
  The ID of the Plain thread this discussion is attached to. Null for global Sidekick agent sessions that were not started from a thread.
  """
  threadId: ID

  """
  The support thread when threadId is set. Null when the discussion has no thread (e.g. some global Sidekick sessions).
  """
  thread: Thread
  title: String!
  messages(first: Int, after: String, last: Int, before: String): ThreadDiscussionMessageConnection!

  """
  Lifecycle of the discussion: OPEN until it is resolved, RESOLVED when resolvedAt is set.
  What the agent is doing is reported separately by agentStatus.
  """
  status: ThreadDiscussionStatus!

  """
  What the agent working on this discussion is doing. UNKNOWN when no agent is involved.
  Prefer this over status for anything agent-related: status is narrowing to OPEN / RESOLVED.
  """
  agentStatus: ThreadDiscussionAgentStatus!

  """The agent that was asked. Null means Plain's Sidekick."""
  agent: MachineUser
  resolvedAt: DateTime

  """
  Timestamp of the most recent message in the discussion. Null when no messages have been posted yet.
  """
  lastActivityAt: DateTime

  """
  True when the discussion has an unread agent response (set when a Sidekick agent
  session settles into IDLE, cleared when the session is opened / marked read).
  """
  isUnread: Boolean!
  createdAt: DateTime!
  createdBy: Actor!
  updatedAt: DateTime!
  updatedBy: Actor!

  """
  Channel-specific details for the discussion (Slack channel info, email recipients, or agent session ID). The concrete type depends on the discussion type.
  """
  channelDetails: ThreadDiscussionChannelDetails

  """
  The Sidekick agent session backing this discussion, when it has one. Set for
  AGENT_SESSION discussions and for SLACK discussions started by a Sidekick
  mention, whose session is linked to the discussion rather than carried in
  channelDetails. Null for discussions with no agent session.
  """
  agentSessionId: ID

  """
  Who can see this discussion. WORKSPACE means visible to all workspace members, USER means visible only to the creator. Null when not yet set.
  """
  visibility: ThreadDiscussionVisibility

  """
  When the discussion was started from an entity page (company, tenant, etc.). Null when source is thread-only, a plain link, or absent.
  """
  sourceEntityId: ID

  """
  The type of entity for sourceEntityId (e.g. COMPANY, TENANT). Null when sourceEntityId is not set.
  """
  sourceEntityType: DiscussionSourceEntityType

  """
  What kind of source this discussion was started from (THREAD | PAGE | ENTITY | CHART). Null for older rows with no source.
  """
  sourceType: DiscussionSourceType

  """
  The page path where this discussion was started (e.g. '/workspace/ws_xxx/insights').
  Set for PAGE and CHART sources; null otherwise (older rows, or thread/entity-only context).
  """
  sourcePageLink: String

  """
  The page-fragment anchor (no '#') identifying the element the discussion was started from,
  e.g. a specific reporting chart. Kept separate from sourcePageLink, which is matched exactly
  as a page-scope key and must stay hash-free. Set only for PAGE and CHART sources; null otherwise.
  """
  sourcePageAnchor: String
  type: ThreadDiscussionType! @deprecated(reason: "Use channelDetails instead")
  slackTeamId: String @deprecated(reason: "Use channelDetails.slackTeamId instead")
  slackChannelId: String @deprecated(reason: "Use channelDetails.slackChannelId instead")
  slackChannelName: String @deprecated(reason: "Use channelDetails.slackChannelName instead")
  slackMessageLink: String @deprecated(reason: "Use channelDetails.slackMessageLink instead")
  emailRecipients: [String!]! @deprecated(reason: "Use channelDetails.emailRecipients instead")

  """
  User-authored messages that the user has submitted but the agent has not
  picked up yet because it was mid-turn. Empty for non-AGENT_SESSION
  discussions. Frontend can render these as greyed-out preview bubbles
  pinned to the bottom of the chat; they disappear when the agent picks
  them up (a real ThreadDiscussionMessage is created at that point with a
  correctly-ordered timestamp) or when the queue is cleared by error /
  timeout / manual stop.
  """
  queuedAgentSessionMessages: [QueuedAgentSessionMessage!]!
}

"""
A user message that has been submitted to a Sidekick AGENT_SESSION
discussion while the agent was mid-turn. Lives in the queue until the
agent picks it up. Once picked up, it's promoted to a regular
ThreadDiscussionMessage and removed from the queue.
"""
type QueuedAgentSessionMessage {
  id: ID!
  text: String!
  workspaceFiles: [WorkspaceFile!]!
  createdAt: DateTime!
  createdBy: Actor!
  updatedAt: DateTime!
  updatedBy: Actor!
}

input DeleteQueuedAgentSessionMessageInput {
  queuedAgentSessionMessageId: ID!
}

type DeleteQueuedAgentSessionMessageOutput {
  error: MutationError
}

input EditQueuedAgentSessionMessageInput {
  queuedAgentSessionMessageId: ID!

  """
  New markdown body for the queued message. Attachments are preserved as-is.
  """
  markdownContent: String!
}

type EditQueuedAgentSessionMessageOutput {
  queuedAgentSessionMessage: QueuedAgentSessionMessage
  error: MutationError
}

type ThreadDiscussionEdge {
  node: ThreadDiscussion!
  cursor: String!
}

type ThreadDiscussionConnection {
  edges: [ThreadDiscussionEdge!]!
  pageInfo: PageInfo!
}

input DiscussionsFilter {
  createdByUserIds: [ID!]

  """
  Only return discussions in which one of the provided users has authored a message. Independent of
  who created the discussion: combine it with createdByUserIds via or to get everything a user
  either started or took part in. A Sidekick reply that is still queued behind the agent's current
  turn already counts, so a session appears the moment the user sends into it.
  """
  participatedByUserIds: [ID!]
  discussionTypes: [DiscussionType!]
  threadIds: [ID!]

  """
  Only return entity-scoped discussions whose source entity id is one of the provided values.
  """
  sourceEntityIds: [ID!]

  """
  Only return entity-scoped discussions whose source entity type is one of the provided values.
  """
  sourceEntityTypes: [DiscussionSourceEntityType!]

  """
  Only return page-scoped discussions whose source page link is one of the provided values.
  """
  sourcePageLinks: [String!]

  """
  Only return discussions whose last activity is at or after this timestamp. ISO 8601 format (e.g. 2024-10-28T18:30:00Z).
  """
  lastActivityAtAfter: String

  """
  Only return discussions whose last activity is strictly before this timestamp. ISO 8601 format (e.g. 2024-10-28T18:30:00Z).
  """
  lastActivityAtBefore: String

  """
  Only return discussions whose status is one of the provided values.
  This is the discussion's own lifecycle; filter on agentStatuses for what the agent is doing.
  """
  statuses: [ThreadDiscussionStatus!]

  """
  Only return discussions whose agent status is one of the provided values.
  This does not filter by whether the discussion is open: a resolved discussion keeps the agent
  status it had when it was resolved. Combine with statuses: [OPEN] to exclude resolved ones.
  """
  agentStatuses: [ThreadDiscussionAgentStatus!]

  """
  When true, only return discussions that are unread (have an unread agent response). When false, only return read discussions. Can be combined with statuses.
  """
  isUnread: Boolean

