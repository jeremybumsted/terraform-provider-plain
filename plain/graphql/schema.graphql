"""
Represents the current load state of a single customer card for a specific customer.

A customer can only have one card instance per config at any point in time. The three concrete implementations — `CustomerCardInstanceLoading`, `CustomerCardInstanceLoaded`, and `CustomerCardInstanceError` — reflect whether the card is being fetched, has loaded successfully, or failed to load.
"""
interface CustomerCardInstance {
  """
  The ID of the customer card instance. A new ID is generated for each load.
  """
  id: ID!

  """The customer the instance is for."""
  customerId: ID!

  """
  The thread the instance is for. Null if this card is not loaded in a thread context.
  """
  threadId: ID

  """The customer card config this instance is for."""
  customerCardConfig: CustomerCardConfig!
  createdAt: DateTime!
  createdBy: Actor!
  updatedAt: DateTime!
  updatedBy: Actor!
}

"""
A customer card instance that is currently being fetched from the configured API URL.

The `createdAt` timestamp indicates when the load was initiated. Subscribe to `customerCardInstanceChanges` to be notified when it transitions to `CustomerCardInstanceLoaded` or `CustomerCardInstanceError`.
"""
type CustomerCardInstanceLoading implements CustomerCardInstance {
  """
  The ID of the customer card instance. A new ID is generated for each load.
  """
  id: ID!

  """The customer the instance is for."""
  customerId: ID!

  """
  The thread the instance is for. Null if this card is not loaded in a thread context.
  """
  threadId: ID

  """The customer card config this instance is for."""
  customerCardConfig: CustomerCardConfig!
  createdAt: DateTime!
  createdBy: Actor!
  updatedAt: DateTime!
  updatedBy: Actor!
}

"""
A successfully loaded customer card instance containing the card components returned by your API.

The card remains valid until `expiresAt`, after which the next access will trigger a reload.
"""
type CustomerCardInstanceLoaded implements CustomerCardInstance {
  """
  The ID of the customer card instance. A new ID is generated for each load.
  """
  id: ID!

  """The customer the instance is for."""
  customerId: ID!

  """
  The thread the instance is for. Null if this card is not loaded in a thread context.
  """
  threadId: ID

  """The customer card config this instance is for."""
  customerCardConfig: CustomerCardConfig!

  """
  The list of components of the customer card. If this is null it means the customer card was returned on the API, but the components array was empty.
  """
  components: [CustomerCardComponent!]

  """When the customer card was received from the API."""
  loadedAt: DateTime!

  """
  When this cached card instance will expire and trigger a reload on the next access.
  """
  expiresAt: DateTime!
  createdAt: DateTime!
  createdBy: Actor!
  updatedAt: DateTime!
  updatedBy: Actor!
}

"""The configured API URL didn't return a requested card key."""
type CustomerCardInstanceMissingCardErrorDetail {
  message: String!
  cardKey: String!
}

"""An invalid response body was returned from the configured API URL."""
type CustomerCardInstanceResponseBodyErrorDetail {
  message: String!
  responseBody: String! @deprecated(reason: "No longer supported, returns dummy data")
}

"""A non-200 status code was returned from the configured API URL."""
type CustomerCardInstanceStatusCodeErrorDetail {
  message: String!
  statusCode: Int!
  responseBody: String! @deprecated(reason: "No longer supported, returns dummy data")
}

"""Plain failed to make the request to the configured API URL."""
type CustomerCardInstanceRequestErrorDetail {
  message: String!
  errorCode: String!
}

"""
An unknown error occurred. If this error is persistent, please contact our support.
"""
type CustomerCardInstanceUnknownErrorDetail {
  message: String!
}

"""The card failed to load within the timeout."""
type CustomerCardInstanceTimeoutErrorDetail {
  message: String!
  timeoutSeconds: Int!
}

"""The card exceeded the maximum allowed size."""
type CustomerCardInstanceCardTooBigErrorDetail {
  message: String!
  cardKey: String!
  sizeBytes: Int!
  maxSizeBytes: Int!
}

"""Details for the reasons why the customer card failed to load."""
union CustomerCardInstanceErrorDetail = CustomerCardInstanceMissingCardErrorDetail | CustomerCardInstanceResponseBodyErrorDetail | CustomerCardInstanceStatusCodeErrorDetail | CustomerCardInstanceRequestErrorDetail | CustomerCardInstanceUnknownErrorDetail | CustomerCardInstanceTimeoutErrorDetail | CustomerCardInstanceCardTooBigErrorDetail

"""
A customer card instance that failed to load. Inspect `errorDetail` to determine why: the card API returned a non-200 status, timed out, returned an invalid body, or did not include the requested card key.
"""
type CustomerCardInstanceError implements CustomerCardInstance {
  """
  The ID of the customer card instance. A new ID is generated for each load.
