Narrows a send's delivery list. Omit a field to leave that dimension unconstrained.
"""
input BroadcastSendDeliveriesFilter {
  """Filters deliveries to those whose status is one of the given statuses."""
  statuses: [BroadcastSendDeliveryStatus!]
}

"""
Narrows a broadcast's send list. Omit a field to leave that dimension unconstrained.
"""
input BroadcastSendsFilter {
  """Filters sends to those whose status is one of the given statuses."""
  statuses: [BroadcastSendStatus!]

  """
  `false` for real sends only, `true` for test sends only. Omit for both, which is a broadcast's
  whole history.
  """
  isTest: Boolean
}

type BroadcastSendEdge {
  cursor: String!
  node: BroadcastSend!
}

type BroadcastSendConnection {
  edges: [BroadcastSendEdge!]!
  pageInfo: PageInfo!

  """How many sends match the query, ignoring pagination."""
  totalCount: Int!
}

"""
One run of a broadcast: the recipients it resolved to and what became of each of them. A broadcast's
`status`, `scheduledAt`, `startedAt` and `completedAt` come from its most recent send, which is why
they read as null or `DRAFT` on a broadcast that has none.
"""
type BroadcastSend {
  id: ID!
  status: BroadcastSendStatus!

  """
  Whether this was a test send. A test send posts real messages to real channels and collects real
  deliveries, so it is only distinguishable by this field — but it never contributes to the
  broadcast's own `status`.
  """
  isTest: Boolean!

  """When the send is due, or when it was due if it has already run."""
  scheduledAt: DateTime!

  """
  When the send began, as opposed to when it was due. Null until it starts.
  """
  startedAt: DateTime

  """
  When the send reached a terminal state, whatever that state was. Null until it finishes.
  """
  completedAt: DateTime

  """
  Progress across the send's recipients. Prefer this over counting `deliveries` — it is one query
  regardless of how many recipients the send has.
  """
  deliveryCounts: BroadcastSendDeliveryCounts!

  """
  The send's recipients, one edge per recipient, newest first. Empty until the send has resolved who
  it applies to. Requires the `broadcast:read` permission.
  """
  deliveries(filters: BroadcastSendDeliveriesFilter, first: Int, after: String, last: Int, before: String): BroadcastSendDeliveryConnection!
}

"""The authored content of a broadcast, before it is sent to any channel."""
type Broadcast {
  id: ID!

  """
  Human-readable name used to identify the broadcast. Internal only — it is never shown to recipients. This is what `searchBroadcasts` matches on.
  """
  name: String!

  """
  The title recipients see in the notification the broadcast arrives as. Unlike `name` this does leave Plain, and a broadcast cannot be sent until it is set. Null until then.
  """
  notificationTitle: String

  """The body of the broadcast, encoded as described by `contentFormat`."""
  content: String!

  """How `content` is encoded, as declared when the broadcast was created."""
  contentFormat: BroadcastContentFormat!

  """
  The channel this broadcast is authored for. Fixed at creation — content is written against this channel's rendering rules, so a broadcast cannot be moved to another channel.
  """
  type: BroadcastType!

  """
  Who the broadcast is sent as. The variant matches the broadcast's `type`. Null until a sender is set.
  """
  sender: BroadcastSender

  """
  Who the broadcast is sent to. Resolved to concrete recipients at send time, not when scheduled. Empty until a target is set.
  """
  sendTarget: BroadcastSendTarget!

  """Where the broadcast is in its lifecycle."""
  status: BroadcastStatus!

  """
  The broadcast's send history, newest first, and where per-recipient progress lives. Empty while the
  broadcast is a draft.
  
  Unfiltered this includes test sends, which post real messages and collect real deliveries — check
  `isTest`, or narrow with `filters`, before presenting an entry as a real send. Because of that the
  first edge is not necessarily the send `status` describes; use `latestSend` for that.
  
  Ordered by `scheduledAt` descending — a send's place in the history is when it was due to go out.
  Rescheduling therefore moves a send within the list, but only a `SCHEDULED` send can be
  rescheduled and it already sorts first, so the settled part of the history does not shift.
  """
  sends(filters: BroadcastSendsFilter, first: Int, after: String, last: Int, before: String): BroadcastSendConnection!

  """
  The send the broadcast's lifecycle fields are derived from: the most recent one that is not a test
  send, which is the same row `status`, `scheduledAt`, `startedAt` and `completedAt` come from. Null
  while the broadcast is a draft.
  
  Equivalent to the first edge of `sends(filters: { isTest: false })`, but batched across a list of
  broadcasts where the connection is not — so prefer this in a list view and `sends` on a detail view.
  """
  latestSend: BroadcastSend

  """
  When the broadcast's send is due, or when it started if it is already underway. Null while the broadcast is a draft.
  """
  scheduledAt: DateTime

  """
  When the send actually began, as opposed to when it was due. Null until it starts.
  """
  startedAt: DateTime

  """
  When the send reached a terminal state, whatever that state was. Null until it finishes.
  """
  completedAt: DateTime

  """
  Whether the broadcast has been soft-deleted. Soft-deleted broadcasts are excluded from lists and search but remain queryable by ID.
  """
  isDeleted: Boolean!
  createdAt: DateTime!
  createdBy: InternalActor!
  updatedAt: DateTime!
  updatedBy: InternalActor!

  """
  The timestamp at which the broadcast was soft-deleted, or null if it has not been deleted.
  """
  deletedAt: DateTime

  """
  The user or machine user that deleted the broadcast, or null if it has not been deleted.
  """
  deletedBy: InternalActor

  """
  Threads created by replies to the messages this broadcast posted. Equivalent to querying
  `threads` with a `broadcastIds` filter, so the connection reports the same `totalCount` the
  filter would.
  """
  threads(first: Int, after: String, last: Int, before: String): ThreadConnection!

  """
  Reactions on the messages this broadcast posted, one entry per emoji, totalled across every channel
  it reached.
  """
  reactions: [BroadcastReactionCount!]!
}

"""One emoji and how many times it was used on a broadcast's messages."""
type BroadcastReactionCount {
  emojiName: String!
  count: Int!
}

type Snippet {
