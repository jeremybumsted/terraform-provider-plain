enum EmailAuthenticity {
  PASS
  FAIL
  UNKNOWN
}

enum EmailBounceReason {
  """
  Recipient was on suppression list at send time. The original SMTP failure that suppressed it is in 'details' when available.
  """
  INACTIVE_RECIPIENT

  """Recipient is a no-reply address."""
  NO_REPLY_RECIPIENT

  """Received a permanent delivery failure (e.g. mailbox does not exist)."""
  HARD_BOUNCE

  """
  Receiving server temporarily failed delivery (e.g. greylisting, network issue).
  """
  TRANSIENT

  """Recipient marked the email as spam."""
  SPAM_COMPLAINT

  """Recipient's mail server flagged the email as spam."""
  SPAM_NOTIFICATION

  """
  An auto-responder reply was received from the recipient (e.g. out-of-office).
  """
  AUTO_RESPONDER

  """Recipient domain failed DNS resolution."""
  DNS_ERROR

  """Recipient's server returned a soft bounce."""
  SOFT_BOUNCE

  """Recipient was undeliverable for an unspecified reason."""
  UNDELIVERABLE

  """Recipient address is malformed or invalid."""
  BAD_EMAIL_ADDRESS

  """Recipient was manually deactivated."""
  MANUALLY_DEACTIVATED

  """Recipient was blocked by provider."""
  BLOCKED

  """Bounce reason is not known."""
  UNKNOWN
}

type EmailBounce {
  bouncedAt: DateTime!
  recipient: EmailParticipant!
  isSendRetriable: Boolean!

  """
  Why the bounce happened. Use this to differentiate suppression-list rejections (INACTIVE_RECIPIENT) from real delivery failures (HARD_BOUNCE, SPAM_COMPLAINT, etc).
  """
  reason: EmailBounceReason!

  """
  Free-form bounce detail string (typically the SMTP response from the receiving server). Null when no detail is available.
  """
  details: String
}

enum EmailSendStatus {
  """The email is being sent."""
  PENDING

  """The email was sent successfully to all recipients."""
  SENT

  """
  Some (or all) of the recipients bounced the email, meaning they did not recieve it. Check 'bounces' for more details on which recipients bounced.
  """
  BOUNCED

  """
  The email failed to send. This will happen if the main recipient (To) bounced the email, or if there was an unexpected error sending the email.
  """
  FAILED
}

type EmailEntry {
  emailId: ID!
  to: EmailParticipant!
  from: EmailParticipant!
  additionalRecipients: [EmailParticipant!]!
  hiddenRecipients: [EmailParticipant!]!
